<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0b0d">
  <title>KIN · Engine Wake</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#08090b;color:#f3f4f6;display:grid;place-items:center;padding:24px}
    .card{width:min(520px,100%);border:1px solid #262930;border-radius:22px;background:#111318;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
    .eyebrow{font-size:12px;letter-spacing:.18em;color:#8b93a1;font-weight:700}
    h1{font-size:30px;margin:10px 0 8px}
    p{color:#a8afbb;line-height:1.5;margin:0 0 22px}
    .status{margin:0 0 18px;padding:12px 14px;border:1px solid #262930;border-radius:14px;background:#0c0e12;color:#c6ccd5;font:13px ui-monospace,SFMono-Regular,Consolas,monospace}
    button,a,input{width:100%;border-radius:14px;padding:15px 16px;font-weight:800;font-size:15px}
    button,a{text-decoration:none;text-align:center;display:block}
    input{border:1px solid #2a2e36;background:#0c0e12;color:#f3f4f6;margin-bottom:10px}
    #wake,#unlock,#setupPin{border:0;background:#f3f4f6;color:#08090b;cursor:pointer}
    #wake:disabled,#unlock:disabled,#setupPin:disabled{opacity:.55;cursor:wait}
    #open{margin-top:10px;border:1px solid #2a2e36;color:#d6dae1;background:#171a20}
    .ok{color:#8de1a8}.bad{color:#ff9d9d}.warn{color:#ffd28d}.muted{font-size:12px;color:#747c88;margin-top:18px}
    .lock{display:none;margin-top:4px}.lock.active{display:block}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">KIN · ENGINE CONTROL</div>
    <h1>START ENGINE</h1>
    <p>Komut doğrudan evdeki Android KIN Relay'e gider. PC'nin veya Supervisor'ın açık olması gerekmez.</p>

    <div id="status" class="status">Wake relay hazırlanıyor…</div>

    <div id="setupBox" class="lock">
      <input id="newPin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="Yeni owner PIN · en az 6 karakter">
      <input id="newPin2" type="password" inputmode="numeric" autocomplete="new-password" placeholder="PIN tekrar">
      <button id="setupPin" type="button">OWNER PIN OLUŞTUR</button>
    </div>

    <div id="unlockBox" class="lock">
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Owner PIN">
      <button id="unlock" type="button">UNLOCK ENGINE CONTROL</button>
    </div>

    <button id="wake" type="button" disabled>START ENGINE</button>
    <a id="open" href="https://kin.shirokinstudio.com/">OPEN FULL KIN CONTROL</a>
    <div class="muted">Wake anahtarı ve PIN yalnızca bu tarayıcıda saklanır. Public GitHub reposunda bulunmaz.</div>
  </main>
<script>
(() => {
  const TOPIC_KEY='kin.wake.topic.v1';
  const SECRET_KEY='kin.wake.secret.v1';
  const PIN_SALT_KEY='kin.wake.pin.salt.v1';
  const PIN_HASH_KEY='kin.wake.pin.hash.v1';
  const status=document.getElementById('status');
  const wake=document.getElementById('wake');
  const setupBox=document.getElementById('setupBox');
  const unlockBox=document.getElementById('unlockBox');
  const newPin=document.getElementById('newPin');
  const newPin2=document.getElementById('newPin2');
  const setupPin=document.getElementById('setupPin');
  const pin=document.getElementById('pin');
  const unlock=document.getElementById('unlock');
  let unlocked=false;

  const incoming=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):'');
  const topicIn=incoming.get('topic');
  const secretIn=incoming.get('secret');
  if(topicIn&&secretIn){
    localStorage.setItem(TOPIC_KEY,topicIn);
    localStorage.setItem(SECRET_KEY,secretIn);
    history.replaceState(null,'',location.pathname+location.search);
  }

  function cfg(){
    return {
      topic:localStorage.getItem(TOPIC_KEY)||'',
      secret:localStorage.getItem(SECRET_KEY)||''
    };
  }

  function b64(bytes){return btoa(String.fromCharCode(...bytes));}
  async function derivePin(pinText,saltBytes){
    const enc=new TextEncoder();
    const material=await crypto.subtle.importKey('raw',enc.encode(pinText),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits(
      {name:'PBKDF2',hash:'SHA-256',salt:saltBytes,iterations:150000},
      material,256
    );
    return b64(new Uint8Array(bits));
  }

  function saltFromStorage(){
    const s=localStorage.getItem(PIN_SALT_KEY)||'';
    if(!s)return null;
    return Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  }

  function render(){
    const c=cfg();
    setupBox.classList.remove('active');
    unlockBox.classList.remove('active');
    wake.disabled=true;

    if(!c.topic||!c.secret){
      status.innerHTML='<span class="bad">NOT PAIRED</span> · Bu tarayıcı KIN Phone Relay ile eşleştirilmemiş.';
      return;
    }

    const hasPin=Boolean(localStorage.getItem(PIN_HASH_KEY)&&localStorage.getItem(PIN_SALT_KEY));
    if(!hasPin){
      status.innerHTML='<span class="warn">OWNER LOCK SETUP</span> · İlk kullanım için kalıcı PIN oluştur.';
      setupBox.classList.add('active');
      return;
    }

    if(!unlocked){
      status.innerHTML='<span class="warn">LOCKED</span> · Engine Control kilitli.';
      unlockBox.classList.add('active');
      return;
    }

    status.innerHTML='<span class="ok">PHONE RELAY READY</span> · Cloud wake hazır.';
    wake.disabled=false;
  }

  setupPin.addEventListener('click',async()=>{
    const a=newPin.value;
    const b=newPin2.value;
    if(a.length<6){status.innerHTML='<span class="bad">PIN TOO SHORT</span> · En az 6 karakter kullan.';return;}
    if(a!==b){status.innerHTML='<span class="bad">PIN MISMATCH</span> · PIN tekrarını kontrol et.';return;}
    setupPin.disabled=true;
    try{
      const salt=crypto.getRandomValues(new Uint8Array(16));
      const hash=await derivePin(a,salt);
      localStorage.setItem(PIN_SALT_KEY,b64(salt));
      localStorage.setItem(PIN_HASH_KEY,hash);
      newPin.value='';newPin2.value='';
      unlocked=true;
      render();
    }finally{setupPin.disabled=false;}
  });

  unlock.addEventListener('click',async()=>{
    const salt=saltFromStorage();
    const expected=localStorage.getItem(PIN_HASH_KEY)||'';
    if(!salt||!expected)return render();
    unlock.disabled=true;
    try{
      const actual=await derivePin(pin.value,salt);
      if(actual!==expected){
        status.innerHTML='<span class="bad">ACCESS DENIED</span> · PIN yanlış.';
        pin.value='';
        return;
      }
      pin.value='';
      unlocked=true;
      render();
    }finally{unlock.disabled=false;}
  });

  pin.addEventListener('keydown',e=>{if(e.key==='Enter')unlock.click();});

  wake.addEventListener('click',async()=>{
    if(!unlocked)return render();
    const c=cfg();
    if(!c.topic||!c.secret)return render();
    wake.disabled=true;
    status.textContent='WAKE gönderiliyor…';
    try{
      const response=await fetch('https://ntfy.sh/'+encodeURIComponent(c.topic),{
        method:'POST',
        body:'WAKE:'+c.secret,
        headers:{'Content-Type':'text/plain;charset=utf-8'}
      });
      if(!response.ok)throw new Error('HTTP '+response.status);
      status.innerHTML='<span class="ok">WAKE QUEUED</span> · Komut telefon relay için kuyruğa bırakıldı.';
      setTimeout(()=>{if(unlocked)wake.disabled=false;},1800);
    }catch(error){
      status.innerHTML='<span class="bad">WAKE FAILED</span> · '+String(error.message||error);
      wake.disabled=false;
    }
  });

  render();
})();
</script>
</body>
</html>
