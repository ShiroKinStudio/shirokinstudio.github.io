<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self' https://trigger.macrodroid.com; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>KIN · Engine Wake</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#08090b;color:#f3f4f6;display:grid;place-items:center;padding:24px}
.card{width:min(520px,100%);border:1px solid #262930;border-radius:22px;background:#111318;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.45)}
.eyebrow{font-size:12px;letter-spacing:.18em;color:#8b93a1;font-weight:700}
h1{font-size:30px;margin:10px 0 8px}
p{color:#a8afbb;line-height:1.5;margin:0 0 22px}
.status{margin:0 0 18px;padding:12px 14px;border:1px solid #262930;border-radius:14px;background:#0c0e12;color:#c6ccd5;font:13px Consolas,monospace}
button,a,input{width:100%;border-radius:14px;padding:15px 16px;font-weight:800;font-size:15px}
button,a{text-decoration:none;text-align:center;display:block}
input{border:1px solid #2a2e36;background:#0c0e12;color:#f3f4f6;margin-bottom:10px}
button{border:0;background:#f3f4f6;color:#08090b;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#open{margin-top:10px;border:1px solid #2a2e36;color:#d6dae1;background:#171a20}
#wake,#lockAgain{display:none}
#wake.visible,#lockAgain.visible{display:block}
#lockAgain{margin-top:10px;background:#171a20;border:1px solid #2a2e36;color:#d6dae1}
.muted{font-size:12px;color:#8b93a1;margin-top:16px;line-height:1.5}
</style>
</head>
<body>
<main class="card">
  <div class="eyebrow">KIN · ENGINE CONTROL</div>
  <h1>START ENGINE</h1>
  <p>KIN Wake giriş şifreni yaz. MacroDroid <b>kinwake</b> tetikleyicisi arka planda eşleştirilmiştir.</p>
  <div id="status" class="status" role="status" aria-live="polite">LOCKED · Şifreni gir.</div>
  <div id="lock">
    <input id="password" type="password" autocomplete="current-password" placeholder="KIN Wake giriş şifresi">
    <button id="unlock" type="button">UNLOCK ENGINE CONTROL</button>
  </div>
  <button id="wake" type="button">START ENGINE</button>
  <button id="lockAgain" type="button">KİLİTLE</button>
  <a id="open" href="https://kin.shirokinstudio.com/">OPEN FULL KIN CONTROL</a>
  <div class="muted">3 yanlış denemede bu tarayıcı 1 dakika bekler. Komutun gönderilmesi PC'nin açıldığını tek başına doğrulamaz.</div>
</main>
<script>
(() => {
  'use strict';
  const encoder = new TextEncoder();
  const status = document.getElementById('status');
  const password = document.getElementById('password');
  const lock = document.getElementById('lock');
  const unlock = document.getElementById('unlock');
  const wake = document.getElementById('wake');
  const lockAgain = document.getElementById('lockAgain');
  const LOCK_KEY = 'kin.wake.failed.local.v2';
  let activeWebhook = '';
  let busy = false;

  function report(text){status.textContent=text}
  function getState(){
    try{
      const v=JSON.parse(localStorage.getItem(LOCK_KEY)||'{}');
      return {fails:Number(v.fails)||0,until:Number(v.until)||0};
    }catch{return {fails:0,until:0}}
  }
  function setState(v){try{localStorage.setItem(LOCK_KEY,JSON.stringify(v))}catch{}}
  function remaining(){return Math.max(0,Math.ceil((getState().until-Date.now())/1000))}
  function refreshLock(){
    const sec=remaining();
    if(sec){unlock.disabled=true;report('TOO MANY ATTEMPTS · '+sec+' saniye bekle.');return}
    if(!busy&&!activeWebhook) unlock.disabled=false;
    const s=getState();
    if(s.until&&Date.now()>=s.until)setState({fails:0,until:0});
  }
  function fail(){
    const s=getState();
    const n=s.fails+1;
    if(n>=3){setState({fails:0,until:Date.now()+60000});refreshLock()}
    else{setState({fails:n,until:0});report('Şifre yanlış · '+(3-n)+' deneme hakkı kaldı.')}
  }
  function b64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
  function validWebhook(raw){
    try{
      const u=new URL(raw);
      return u.protocol==='https:'&&u.hostname==='trigger.macrodroid.com'&&!u.username&&!u.password&&!u.hash&&(u.port===''||u.port==='443')&&u.pathname.split('/').filter(Boolean).length>=2;
    }catch{return false}
  }
  async function pairing(){
    const r=await fetch('./pairing.json?v='+Date.now(),{cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
    if(!r.ok)throw new Error('Eşleştirme bulunamadı.');
    const text=await r.text();
    if(text.length>4096)throw new Error('Eşleştirme dosyası geçersiz.');
    return JSON.parse(text);
  }
  async function decrypt(data,pass){
    if(!data||data.version!==2||data.cipher!=='AES-256-GCM'||data.kdf!=='PBKDF2-SHA256'||data.iterations!==600000)throw new Error('Eşleştirme biçimi geçersiz.');
    const salt=b64(data.salt),iv=b64(data.iv),cipher=b64(data.ciphertext);
    const material=await crypto.subtle.importKey('raw',encoder.encode(pass),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
    let plain;
    try{
      plain=await crypto.subtle.decrypt({name:'AES-GCM',iv,additionalData:encoder.encode('KIN-WAKE-PAIRING-V2'),tagLength:128},key,cipher);
    }catch{
      const e=new Error('bad password');e.badPassword=true;throw e;
    }
    const dataOut=JSON.parse(new TextDecoder('utf-8',{fatal:true}).decode(plain));
    if(dataOut.format!=='kin-wake-v2'||!validWebhook(dataOut.webhook))throw new Error('Eşleştirme içeriği geçersiz.');
    return dataOut.webhook;
  }
  async function doUnlock(){
    if(busy||activeWebhook||remaining())return refreshLock();
    const pass=password.value;password.value='';
    if(!pass)return report('KIN Wake giriş şifresini yaz.');
    busy=true;unlock.disabled=true;report('Şifre doğrulanıyor…');
    try{
      activeWebhook=await decrypt(await pairing(),pass);
      setState({fails:0,until:0});
      lock.style.display='none';wake.classList.add('visible');lockAgain.classList.add('visible');
      report('UNLOCKED · START ENGINE hazır.');
    }catch(e){
      activeWebhook='';
      if(e.badPassword)fail();else report('WAKE FAILED · '+(e.message||'Eşleştirme okunamadı.'));
    }finally{busy=false;refreshLock()}
  }
  function doLock(){
    activeWebhook='';
    wake.classList.remove('visible');lockAgain.classList.remove('visible');lock.style.display='';
    report('LOCKED · Şifreni gir.');refreshLock();
  }
  async function doWake(){
    if(!activeWebhook||!validWebhook(activeWebhook))return doLock();
    wake.disabled=true;report('MacroDroid tetikleniyor…');
    try{
      await fetch(activeWebhook,{method:'GET',mode:'no-cors',cache:'no-store',credentials:'omit',referrerPolicy:'no-referrer'});
      report('WAKE SENT · MacroDroid isteği gönderildi. PC açılışını kontrol et.');
    }catch{report('WAKE FAILED · MacroDroid bağlantısını kontrol et.')}
    finally{wake.disabled=false}
  }
  unlock.onclick=doUnlock;
  password.addEventListener('keydown',e=>{if(e.key==='Enter')doUnlock()});
  wake.onclick=doWake;
  lockAgain.onclick=doLock;
  setInterval(refreshLock,1000);
  refreshLock();
})();
</script>
</body>
</html>
